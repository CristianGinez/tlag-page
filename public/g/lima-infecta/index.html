Orden del comandante: dispersarlos por el edificio.
\u2014 Colibr\xED: estante del C\xF3ndor (biblioteca).
\u2014 Mono: esta sala.
\u2014 Ara\xF1a: mecanismo del reloj (azotea).

Tras el gran terremoto, bajo este convento se han sepultado m\xE1s de veinticinco mil almas.

Los hermanos acomodan los huesos en c\xEDrculos, por tama\xF1o, para que descansen en orden.
Pero de noche se oye algo rascar bajo el pozo. El hermano Tom\xE1s dice que es "un hambre que camina".
